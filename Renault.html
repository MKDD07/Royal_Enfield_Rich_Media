<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fixed Slick Carousel</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/slick-carousel/1.8.1/slick.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/slick-carousel/1.8.1/slick.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/slick-carousel/1.8.1/slick-theme.min.css">
    
    <style>
        /* Reset to prevent conflicts */
        .section * {
            box-sizing: border-box;
            margin: auto;
            padding: 0;
        }
        .section {
            margin: 20px auto;
            background: #241E20;
            width: 100%;
            max-width: 650px;
            position: relative;
            height: 100%;
            display: flex;
            flex-direction: column;
            opacity: 0;
            transition: opacity 0.8s ease-in;
        }
        .section.loaded {
            opacity: 1;
        }
        .section .image-box {
            position: relative;
            width: 100%;
            flex-shrink: 0;
        }
        .section .image-box img {
            width: 100%;
            display: block;
            height: auto;
            object-fit: contain;
            object-position: center;
        }
        .section .gradient {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 40%;
            background: linear-gradient(180deg, rgba(36, 30, 32, 0) 0%, #241E20 100%);
            pointer-events: none;
        }
        .section .logo-card {
            position: absolute;
            width: 140px;
            height: 140px;
            right: 10px;
            top: 10px;
            background-image: url(https://cdn.shopify.com/s/files/1/0781/5148/3632/files/Asset_3_3.png?v=1764955792);
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
            pointer-events: none;
        }
        .section .btner {
            display: flex;
            flex-direction: row;
            justify-content: center;
            align-items: center;
            padding: 10px;
            gap: 10px;
            background: #A61B0F;
            box-shadow: 0px 1px 1px rgba(166, 27, 15, 0.25);
            border-radius: 5px;
            font-style: normal;
            font-weight: 500;
            font-size: 17px;
            line-height: 26px;
            color: #FFFFFF;
            flex: none;
            order: 0;
            flex-grow: 0;
            border: none;
            cursor: pointer;
            margin: 20px auto;
            text-decoration: none;
            transition: background 0.3s ease;
        }
        .section .btner:hover {
            background: #A61B0F;
        }
        .section .carousel-container {
            width: 90%;
            max-width: 400px;
            margin: 50px auto 10px;
            flex-shrink: 0;
            position: relative;
            min-height: 400px;
        }
        /* Hide carousel until initialized - FIXES GLITCH */
        .section .slick-slider {
            position: relative;
            opacity: 0;
            transition: opacity 0.4s ease;
        }
        .section .slick-slider.slick-initialized {
            opacity: 1;
        }
        .section .slick-slider .slick-slide {
            outline: none;
        }
        .section .slick-slider .slick-slide img {
            width: 100%;
            height: 400px;
            aspect-ratio: 1 / 1;
            object-fit: cover;
            border-radius: 10px;
            display: block;
        }
        /* Custom arrow styles */
        .section .slick-prev,
        .section .slick-next {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            z-index: 10;
            width: 36px;
            height: 36px;
            background: white;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0.75;
            transition: opacity 0.3s ease;
            border: none;
        }
        .section .slick-prev:hover,
        .section .slick-next:hover {
            opacity: 1;
        }
        .section .slick-prev {
            left: 10px;
        }
        .section .slick-next {
            right: 10px;
        }
        .section .slick-prev::before,
        .section .slick-next::before {
            content: '';
            display: block;
            width: 8px;
            height: 8px;
            border-top: 2px solid #A61B0F;
            border-right: 2px solid #A61B0F;
        }
        .section .slick-prev::before {
            transform: rotate(-135deg);
            margin-left: 3px;
        }
        .section .slick-next::before {
            transform: rotate(45deg);
            margin-right: 3px;
        }
        /* Custom dots styles */
        .section .slick-dots {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            list-style: none;
            padding: 0;
            margin: 15px 0 0 0;
        }
        .section .slick-dots li {
            margin: 0;
            padding: 0;
        }
        .section .slick-dots li button {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.5);
            border: none;
            cursor: pointer;
            font-size: 0;
            padding: 0;
            transition: background 0.3s ease;
        }
        .section .slick-dots li.slick-active button {
            background: white;
        }
        @media (max-width: 576px) {
            .section .image-box img {
                object-fit: cover;
                height: 300px;
                object-position: right;
            }
            .section .slick-slider .slick-slide img {
                object-fit: contain;
                border-radius: 10px;
                height: auto;
            }
            .image-box .logo-card {
                top: 0;
                right: 0;
            }
            .section .carousel-container {
                margin: 20px auto 10px;
                min-height: 300px;
            }
            .section .btner {
                margin: 10px auto;
                font-size: 14px;
            }
            .section {
                margin: 0 auto;
            }
        }
        .slick-slider div span {
            position: absolute;
            top: 0;
            left: 0;
            opacity: 0;
        }
        /* only animate span inside the active slide */
        .slick-current span {
            animation: fadeIn 0.8s ease-in 1s forwards;
        }
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        .section .slick-slider .slick-slide span img {
            width: auto;
            height: 400px;
            aspect-ratio: 1 / 1;
            object-fit: cover;
            border-radius: 10px;
            display: block;
        }
    </style>
</head>
<body>

<section class="section">
    <div class="image-box">
        <img src="https://cdn.shopify.com/s/files/1/0781/5148/3632/files/Lucid_Origin_A_classic_vintagethemed_outdoor_photoshoot_in_fro_2.jpg?v=1764955801" alt="Hero Image">
        <span class="gradient"></span>
        <span class="logo-card"></span>
    </div>

    <div class="carousel-container">
        <div class="slick-slider">
            <div style="position: relative;">
                <img src="https://cdn.shopify.com/s/files/1/0781/5148/3632/files/0001_Image.jpg?v=1765015340" alt="Slide 1">
                <span>
                    <img src="https://cdn.shopify.com/s/files/1/0781/5148/3632/files/0002_alpha.png">
                </span>
            </div>
            <div style="position: relative;">
                <img src="https://cdn.shopify.com/s/files/1/0781/5148/3632/files/0002_Image.jpg?v=1765015339" alt="Slide 2">
                <span>
                    <img src="https://cdn.shopify.com/s/files/1/0781/5148/3632/files/0003_alpha.png">
                </span>
            </div>
            <div style="position: relative;">
                <img src="https://cdn.shopify.com/s/files/1/0781/5148/3632/files/0003_Image.jpg?v=1765015339" alt="Slide 3">
                <span>
                    <img src="https://cdn.shopify.com/s/files/1/0781/5148/3632/files/0001_alpha.png">
                </span>
            </div>
        </div>
    </div>

    <a class="btner" href="https://adomantra.com/ads/RE_Mob1/Carousel.html">KNOW MORE</a>
</section>

<script>
jQuery(document).ready(function($) {
    var $slider = $('.section .slick-slider');
    var $images = $slider.find('img');
    var imagesLoaded = 0;
    var totalImages = $images.length;

    // Fade in the entire section after 1 sec
    setTimeout(function() {
        $('.section').addClass('loaded');
    }, 1000);

    // Initialize slick
    function initSlick() {
        $slider.slick({
            infinite: true,
            speed: 600,
            slidesToShow: 1,
            slidesToScroll: 1,
            autoplay: true,
            autoplaySpeed: 3000,
            arrows: true,
            prevArrow: '<button type="button" class="slick-prev"></button>',
            nextArrow: '<button type="button" class="slick-next"></button>',
            appendDots: $('.section .carousel-container'),
            adaptiveHeight: false,
            fade: false,
            cssEase: 'ease-in-out',
            waitForAnimate: false
        });

        /* ⭐ ANIMATION HANDLER — HIDE ALL OVERLAYS, SHOW ONLY ACTIVE ⭐ */
        $slider.on('beforeChange', function(event, slick, currentSlide, nextSlide) {
            // Hide all overlays immediately
            $(slick.$slides).find('span').css({
                opacity: '0',
                animation: 'none'
            });
        });

        $slider.on('afterChange', function(event, slick, currentSlide) {
            // Show and animate only the current slide overlay
            let $span = $(slick.$slides[currentSlide]).find('span');
            
            // Force reflow to restart animation
            if($span.length > 0) {
                void $span[0].offsetWidth; 
                // Apply fade-in animation
                $span.css('animation', 'fadeIn 0.8s ease-in 0.3s forwards');
            }
        });

        /* ⭐ INITIAL STATE: HIDE ALL OVERLAYS EXCEPT FIRST ⭐ */
        setTimeout(() => {
            let slick = $slider.slick('getSlick');
            if (slick) {
                // Hide all spans first
                $(slick.$slides).find('span').css({
                    opacity: '0',
                    animation: 'none'
                });
                
                // Show only first slide overlay
                let $firstSpan = $(slick.$slides[0]).find('span');
                $firstSpan.css('animation', 'fadeIn 0.8s ease-in 0.5s forwards');
            }
        }, 50);
    }

    // Count loaded images
    function imageLoaded() {
        imagesLoaded++;
        if (imagesLoaded === totalImages) {
            initSlick();
        }
    }

    // Wait for all images
    if(totalImages === 0) {
        initSlick();
    } else {
        $images.each(function() {
            if (this.complete) {
                imageLoaded();
            } else {
                $(this).on('load', imageLoaded);
                $(this).on('error', imageLoaded);
            }
        });
    }

    // Fallback if images don't load
    setTimeout(function() {
        if (!$slider.hasClass('slick-initialized')) {
            initSlick();
        }
    }, 3000);
});

// Mobile height adjust
function applyMobileHeight() {
    const sections = document.querySelectorAll('.section');
    sections.forEach(sec => {
        if (window.innerWidth <= 576) {
            sec.style.height = window.innerHeight + "px";
        } else {
            sec.style.height = "";
        }
    });
}

// Initial + responsive
applyMobileHeight();
window.addEventListener("resize", applyMobileHeight);
window.addEventListener("orientationchange", () => {
    setTimeout(applyMobileHeight, 100);
});
</script>

</body>
</html>
